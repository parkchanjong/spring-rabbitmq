spring.application.name=rabbitmq-notification

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/rabbitmq_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${MYSQL_USERNAME:notification}
spring.datasource.password=${MYSQL_PASSWORD:notification}
spring.jpa.hibernate.ddl-auto=none

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:notification}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:notification}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
