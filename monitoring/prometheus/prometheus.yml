global:
  scrape_interval: 15s

scrape_configs:
  - job_name: rabbitmq-notification
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
        - queue_consumer_count
        - queue_delivery_metrics
    static_configs:
      - targets:
          - rabbitmq:15692
